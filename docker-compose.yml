version: "3.7"

services:
    web:
        image: cynax/php:7.4-fpm
        volumes:
            - .:/var/www/html
        ports:
            - 80:8000
        command: bash -c 'php artisan serve --host=0.0.0.0'
        depends_on:
            - db
        links:
            - db

    db:
        image: mysql:latest
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: learn_que
            MYSQL_USERNAME: cynax
            MYSQL_PASSWORD: password
        ports:
            - 3306:3306

    admin_db:
        image: mysql:latest
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: quadmin
            MYSQL_USERNAME: cynax
            MYSQL_PASSWORD: password
        ports:
            - 3307:3306
